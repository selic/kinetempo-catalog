name = "kinetempo-submissions"
main = "src/index.js"
compatibility_date = "2026-09-01"

# On a domain we own, so the endpoint baked into the app can be re-pointed
# without shipping a new version of it.
[[routes]]
pattern = "submit-kinetempo.defency.net"
custom_domain = true

# Per-address rate limiting, submission fingerprints, cached pull request states
# and the per-document open counts behind the catalog's "most opened" order.
[[kv_namespaces]]
binding = "SUBMISSIONS"
id = "6a73ebfbb8fa4225aa1148562868ec3c"

# GITHUB_TOKEN is a secret, never a variable:
#   npx wrangler secret put GITHUB_TOKEN

name: Telegram

# The review routine runs in an environment whose network policy refuses
# api.telegram.org, so it cannot send the alert itself. It posts its report as a
# pull request comment instead, and this workflow — which does have egress —
# forwards the verdict.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  forward:
    # Only comments on pull requests, and only the routine's report.
    if: github.event.issue.pull_request && contains(github.event.comment.body, '**Verdict:**')
    runs-on: ubuntu-latest
    steps:
      - name: Send the verdict to Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TITLE: ${{ github.event.issue.title }}
          URL: ${{ github.event.issue.html_url }}
          BODY: ${{ github.event.comment.body }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Telegram secrets are not set; nothing to send." && exit 0
          fi
          verdict=$(printf '%s' "$BODY" | grep -m1 -o '\*\*Verdict:\*\*.*' | sed 's/\*\*//g; s/^Verdict: *//')
          text=$(printf '<b>%s</b>\n%s\n\n%s' \
            "$(printf '%s' "$TITLE" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')" \
            "$(printf '%s' "$verdict" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')" \
            "$URL")
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="$CHAT_ID" -d parse_mode=HTML -d disable_web_page_preview=true \
            --data-urlencode text="$text" -o /dev/null -w 'telegram: HTTP %{http_code}\n'

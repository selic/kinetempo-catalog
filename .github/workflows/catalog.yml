name: Catalog

on:
  pull_request:
  push:
    branches: [main]
  # The open counts that order the catalog are baked into the page at build time, so
  # without this the list would freeze between commits.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run validate
      # Not just the schema: the page is rendered from every document, so a file that
      # validates can still break the build that deploys it. On a pull request that has
      # to fail here rather than on main, and with no network — the open counts are a
      # deploy-time luxury, not something a review should wait for or depend on.
      - run: npm run build
        env:
          KINETEMPO_COUNTS_URL: 'off'

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
